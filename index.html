<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Hub</title>
  <link rel="icon" type="image/jpeg" href="calculator.jpg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fbcfe8, #f472b6, #c084fc);
      padding: 20px 0;
    }
    .card {
      background-color: #3b0764;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      color: #fce7f3;
      font-size: 2rem;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: #f472b6;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .category-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .category-group:last-child {
      margin-bottom: 0;
    }
    .category-title {
      color: #f472b6;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(244, 114, 182, 0.3);
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: block;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: #3b0764;
      background-color: #f472b6;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }
    .btn:hover {
      background-color: #e879f9;
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.25);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculator Hub</h1>
    <p class="subtitle">Choose a calculator to get started:</p>

    <!-- General Section -->
    <div class="category-group">
      <div class="category-title">General</div>
      <div class="button-group">
        <a href="calculator.html" class="btn">Standard Calculator</a>
        <a href="percentage-of.html" class="btn">Percentage Calculator</a>
      </div>
    </div>

    <!-- Money Section -->
    <div class="category-group">
      <div class="category-title">Money</div>
      <div class="button-group">
        <a href="uk-tax-calculator.html" class="btn">UK Income Tax Calculator</a>
        <a href="us-income-tax-calculator.html" class="btn">US Income Tax Calculator</a>
        <a href="compound-interest-calculator.html" class="btn">Compound Interest Calculator</a>
        <a href="stock-profit.html" class="btn">Stock Profit Calculator</a>
        <a href="freelance-hourly-calculator.html" class="btn">Freelance Hourly Wage Calculator</a>
      </div>
    </div>

    <!-- Volume Section -->
    <div class="category-group">
      <div class="category-title">Volume</div>
      <div class="button-group">
        <a href="weigh-volume-calculator.html" class="btn">Liquid Volume & Weight Calculator</a>
      </div>
    </div>
  </div>
</body>
</html>
