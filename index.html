<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fbcfe8, #f472b6, #c084fc);
    }

    .calculator {
      background-color: #3b0764;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      width: 320px;
    }

    .display {
      width: 100%;
      height: 70px;
      background-color: #581c87;
      color: #fce7f3;
      font-size: 2rem;
      text-align: right;
      padding: 10px 15px;
      border: none;
      border-radius: 12px;
      margin-bottom: 20px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 55px;
      border: none;
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #a855f7;
      color: #ffffff;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button.operator {
      background-color: #f472b6;
      color: #3b0764;
    }

    button.clear, button.delete {
      background-color: #e879f9;
      color: #3b0764;
    }

    button.equal {
      background-color: #f43f5e;
      color: #ffffff;
      grid-column: span 2;
    }

    button.zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" class="display" id="display" readonly value="0">
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="delete" onclick="deleteChar()">DEL</button>
      <button class="operator" onclick="appendValue('/')">&divide;</button>
